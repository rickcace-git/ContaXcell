# Compila la app Android en GitHub y deja el APK listo para descargar.
#
# Se lanza sola al subir cambios de android/ a master o a Rick, y también a
# mano desde la pestaña Actions («Run workflow»). Ojo: ese botón solo sale
# cuando este archivo ya está en master; mientras viva solo en Rick, la forma
# de lanzarla sin tocar android/ es subir un cambio a este archivo. Hace
# falta, por ejemplo, después de cambiar el secreto CONTAXCELL_SERVIDOR.
# Primero pasa las pruebas: si alguna falla, no hay APK.
#
# El APK sale en la página de la ejecución, abajo, en «Artifacts».
name: App Android

on:
  push:
    branches: [master, Rick]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # La clave de firma fija, si están los secretos (ver android/README.md).
      # Sin ellos el APK sale igual, pero con una clave distinta cada vez.
      - name: Preparar la firma
        env:
          ALMACEN: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ALMACEN" ] && [ -n "$CLAVE" ]; then
            echo "$ALMACEN" | base64 -d > "$RUNNER_TEMP/contaxcell.jks"
            echo "CONTAXCELL_KEYSTORE=$RUNNER_TEMP/contaxcell.jks" >> "$GITHUB_ENV"
            echo "CONTAXCELL_KEYSTORE_PASSWORD=$CLAVE" >> "$GITHUB_ENV"
            echo "Firma fija preparada."
          else
            echo "::warning::Sin los secretos de firma: el móvil no dejará instalar este APK encima de otro."
          fi

      # Un servidor de verdad en local, con una cuenta ya rellena desde el
      # escritorio, para que RealServerTest pruebe entrar y descargar como el
      # móvil.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Arrancar el servidor de prueba
        working-directory: .
        run: |
          pip install --quiet fastapi uvicorn
          python server/pruebas/servidor_para_android.py 8765 > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 60); do
            grep -q listo "$RUNNER_TEMP/servidor.log" && break
            sleep 0.5
          done
          grep -q listo "$RUNNER_TEMP/servidor.log" || { cat "$RUNNER_TEMP/servidor.log"; exit 1; }
          echo "CONTAXCELL_SERVIDOR_PRUEBAS=http://127.0.0.1:8765" >> "$GITHUB_ENV"

      - name: Pruebas y APK
        env:
          # La dirección del servidor con la que viene la app (secreto
          # CONTAXCELL_SERVIDOR). Sin él, la app arranca con localhost.
          CONTAXCELL_SERVIDOR: ${{ secrets.CONTAXCELL_SERVIDOR }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # Si falla una prueba, su mensaje sale como aviso en el resumen de la
      # ejecución: se lee sin descargar nada.
      - name: Contar qué prueba ha fallado
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for ruta in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for caso in ET.parse(ruta).getroot().iter("testcase"):
                  for fallo in list(caso.iter("failure")) + list(caso.iter("error")):
                      mensaje = (fallo.get("message") or fallo.text or "").splitlines()[0][:600]
                      print(f"::error title={caso.get('classname')}.{caso.get('name')}::{mensaje}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ContaXcell-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-pruebas
          path: android/app/build/reports/tests/
