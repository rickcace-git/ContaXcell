# El servidor entero con un `docker compose up -d`: la base de datos y la API.
#
# Los dos secretos NO viven aquí: viven en el archivo `.env` de al lado, que
# no se sube a git. Copia `.env.ejemplo` a `.env` y rellénalo antes del primer
# arranque. Si falta alguno, docker compose se niega a arrancar y dice cuál.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contaxcell
      POSTGRES_USER: contaxcell
      POSTGRES_PASSWORD: ${CONTAXCELL_CLAVE_DB:?falta CONTAXCELL_CLAVE_DB en el archivo .env}
    volumes:
      # Volumen con nombre: los datos sobreviven a reconstruir o borrar los
      # contenedores. Solo `docker volume rm` los borra de verdad.
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contaxcell -d contaxcell"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    ports:
      # Solo por la puerta de atrás: el 8000 se abre en 127.0.0.1 y no se ve
      # desde fuera de la máquina. Quien tiene que llegar de Internet lo hace
      # por el Caddy de abajo, con HTTPS. Y hay una razón de peso para no
      # tocar esto: la API se fía de las cabeceras de proxy que le llegan
      # (para saber la IP de verdad de quien llama), así que publicar el 8000
      # dejaría que cualquiera se inventara la IP que quisiera.
      - "127.0.0.1:8000:8000"
    environment:
      CONTAXCELL_BASE_DATOS: postgresql://contaxcell:${CONTAXCELL_CLAVE_DB}@db:5432/contaxcell
      CONTAXCELL_SECRETO: ${CONTAXCELL_SECRETO:?falta CONTAXCELL_SECRETO en el archivo .env}
      # Opcional: si se pone, para crear una cuenta hay que traer el código.
      CONTAXCELL_CODIGO_REGISTRO: ${CONTAXCELL_CODIGO_REGISTRO:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # El portero con HTTPS. No arranca con un `docker compose up` normal: hay
  # que pedirlo con `docker compose --profile https up -d`. Caddy saca el
  # certificado de Let's Encrypt él solo y lo renueva sin que nadie mire.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config
    environment:
      # El dominio va en el .env. Aquí no se pone `:?` a propósito: compose
      # lee este archivo entero aunque el perfil esté apagado, y con `:?`
      # un `docker compose up` normal se negaría a arrancar sin dominio.
      CONTAXCELL_DOMINIO: ${CONTAXCELL_DOMINIO:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datos_postgres:
  datos_caddy:
  config_caddy:
